<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Turismo 2023-2030</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
    <link rel="stylesheet" href="../styles/header.css" />

    <script
      src="https://kit.fontawesome.com/01f4930683.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="app-container">
      <!-- SINISTRA: Lista Dati -->
      <aside class="sidebar-data">
        <div class="sidebar-header">
          <div class="header-top-row">
            <h2>Archivio & Previsioni</h2>

            <div class="filter-container">
              <button id="filterBtn" class="filter-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"
                  />
                </svg>
                Anni
              </button>
              <div id="filterDropdown" class="filter-dropdown">
                <!-- Opzioni JS -->
              </div>
            </div>
          </div>
        </div>

        <div class="data-scroll-area" id="dataContainer">
          <!-- Tabelle JS -->
        </div>
      </aside>

      <!-- DESTRA: Grafico -->
      <div class="main-content">
        <div class="chat-header">
          <label class="hamburger">
            <input type="checkbox" id="sidebarToggle" />
            <svg viewBox="0 0 32 32">
              <path
                class="line line-top-bottom"
                d="M27 10 13 10C10.8 10 9 8.2 9 6 9 3.5 10.8 2 13 2 15.2 2 17 3.8 17 6L17 26C17 28.2 18.8 30 21 30 23.2 30 25 28.2 25 26 25 23.8 23.2 22 21 22L7 22"
              ></path>
              <path class="line" d="M7 16 27 16"></path>
            </svg>
          </label>

          <span class="header-title" style="font-family: Merriweather"
            >TEK-IA</span
          >
          <button class="setting-button" onclick="vaiAllaDashboard()">
            <svg
              class="svg-icon"
              fill="none"
              height="20"
              viewBox="0 0 20 20"
              width="20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <g stroke="white" stroke-linecap="round" stroke-width="1.5">
                <circle cx="10" cy="10" r="2.5"></circle>
                <path
                  clip-rule="evenodd"
                  d="m8.39079 2.80235c.53842-1.51424 2.67991-1.51424 3.21831-.00001.3392.95358 1.4284 1.40477 2.3425.97027 1.4514-.68995 2.9657.82427 2.2758 2.27575-.4345.91407.0166 2.00334.9702 2.34248 1.5143.53842 1.5143 2.67996 0 3.21836-.9536.3391-1.4047 1.4284-.9702 2.3425.6899 1.4514-.8244 2.9656-2.2758 2.2757-.9141-.4345-2.0033.0167-2.3425.9703-.5384 1.5142-2.67989 1.5142-3.21831 0-.33914-.9536-1.4284-1.4048-2.34247-.9703-1.45148.6899-2.96571-.8243-2.27575-2.2757.43449-.9141-.01669-2.0034-.97028-2.3425-1.51422-.5384-1.51422-2.67994.00001-3.21836.95358-.33914 1.40476-1.42841.97027-2.34248-.68996-1.45148.82427-2.9657 2.27575-2.27575.91407.4345 2.00333-.01669 2.34247-.97026z"
                  fill-rule="evenodd"
                ></path>
              </g>
            </svg>
          </button>
        </div>
        <div class="graph-content">
          <div class="chart-header-area">
            <h1>Analisi Trend Turismo</h1>
            <p id="chartSubtitle">
              Storico (2023-2025) e Previsioni (2026-2030)
            </p>
          </div>

          <!-- Legenda Interattiva: Aggiunto ID e onclick -->
          <div class="custom-legend">
            <div
              class="legend-item"
              id="legend-presenze"
              onclick="toggleDataset(0)"
            >
              <span class="dot" style="background-color: #db2777"></span>
              <span>Presenze</span>
            </div>
            <div
              class="legend-item"
              id="legend-arrivi"
              onclick="toggleDataset(1)"
            >
              <span class="dot" style="background-color: #2563eb"></span>
              <span>Arrivi</span>
            </div>
          </div>

          <div class="chart-wrapper">
            <canvas id="tourismChart"></canvas>
          </div>
        </div>
      </div>
    </div>
    <script src="../script/script.js"></script>
  </body>
</html>
