<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Turismo 2023-2030</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/main.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- SINISTRA: Lista Dati -->
      <aside class="sidebar-data">
        <div class="sidebar-header">
          <div class="header-top-row">
            <h2>Archivio & Previsioni</h2>

            <div class="filter-container">
              <button id="filterBtn" class="filter-btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"
                  />
                </svg>
                Anni
              </button>
              <div id="filterDropdown" class="filter-dropdown">
                <!-- Opzioni JS -->
              </div>
            </div>
          </div>
        </div>

        <div class="data-scroll-area" id="dataContainer">
          <!-- Tabelle JS -->
        </div>
      </aside>

      <!-- DESTRA: Grafico -->
      <main class="main-content">
        <div class="chart-header-area">
          <h1>Analisi Trend Turismo</h1>
          <p id="chartSubtitle">Storico (2023-2025) e Previsioni (2026-2030)</p>
        </div>

        <!-- Legenda Interattiva: Aggiunto ID e onclick -->
        <div class="custom-legend">
          <div
            class="legend-item"
            id="legend-presenze"
            onclick="toggleDataset(0)"
          >
            <span class="dot" style="background-color: #db2777"></span>
            <span>Presenze</span>
          </div>
          <div
            class="legend-item"
            id="legend-arrivi"
            onclick="toggleDataset(1)"
          >
            <span class="dot" style="background-color: #2563eb"></span>
            <span>Arrivi</span>
          </div>
        </div>

        <div class="chart-wrapper">
          <canvas id="tourismChart"></canvas>
        </div>
      </main>
    </div>
    <script src="../script/script.js"></script>
  </body>
</html>
